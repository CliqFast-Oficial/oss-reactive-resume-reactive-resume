name: Mobile OTA Update

on:
  workflow_call:
    inputs:
      sha:
        description: Full source commit of the deployed Docker image
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mobile-ota-update:
    runs-on: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: mobile-ota-update-production
      cancel-in-progress: true
    env:
      EXPO_NO_TELEMETRY: "1"
      COMMIT_SHA: ${{ inputs.sha }}

    steps:
      - name: Check Expo publishing credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add the EXPO_TOKEN Actions secret with access to the reactive-resume Expo project."
            exit 1
          fi

      - name: Checkout Repository
        if: ${{ vars.USE_BLACKSMITH != 'true' }}
        uses: actions/checkout@v7
        with: &checkout-mobile-ota-update
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Checkout Repository (Blacksmith)
        if: ${{ vars.USE_BLACKSMITH == 'true' }}
        uses: useblacksmith/checkout@v1
        with: *checkout-mobile-ota-update

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile app
        run: pnpm --filter mobile typecheck

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 25.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for matching production backend
        run: |
          set -euo pipefail
          matches=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              -H 'Cache-Control: no-cache' "https://rxresu.me/api/health?revision=$COMMIT_SHA&probe=$attempt" \
              | jq --exit-status --arg sha "$COMMIT_SHA" \
                '.service == "reactive-resume" and .status == "healthy" and .revision == $sha' > /dev/null; then
              matches=$((matches + 1))
              if [[ "$matches" -ge 3 ]]; then exit 0; fi
            else
              matches=0
            fi
            sleep 5
          done
          echo "::error::Production backend did not become healthy at commit $COMMIT_SHA; mobile update withheld."
          exit 1

      - name: Publish matching mobile update
        working-directory: apps/mobile
        run: eas update --channel production --environment production --message "Docker $COMMIT_SHA" --upload-source-maps --non-interactive
